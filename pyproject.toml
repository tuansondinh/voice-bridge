[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-bridge"
version = "0.1.0"
description = "Remote voice bridge — connect a phone browser to Claude Code via WebSocket"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pywhispercpp>=1,<2",
    "kokoro>=0.9,<1",
    "misaki[en]>=0.9",
    "pip",
    "claude-agent-sdk>=0.1.0",
]

[project.scripts]
voice-bridge = "voice_bridge.__main__:run_bridge"

[tool.hatch.build.targets.wheel]
packages = ["voice_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Bridge</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface-hover: #1a2744;
  --text: #e8e8e8;
  --text-dim: #8b8fa3;
  --accent: #e94560;
  --accent-glow: rgba(233, 69, 96, 0.3);
  --user-bubble: #0f3460;
  --assistant-bubble: #1e2d4a;
  --success: #4ade80;
  --border: #2a2f4a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
.header {
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header h1 {
  font-size: 16px;
  font-weight: 600;
}

.status {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #666;
  transition: background 0.3s;
}

.status-dot.connected { background: var(--success); }
.status-dot.recording { background: var(--accent); animation: pulse 1s infinite; }
.status-dot.processing { background: #f59e0b; animation: pulse 0.5s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Chat area */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

.message.grouped {
  margin-top: -8px;
}

.message.grouped .label,
.message.grouped .timestamp {
  display: none;
}

.message {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  background: var(--user-bubble);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.message.assistant {
  background: var(--assistant-bubble);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  position: relative;
}

.message .label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.timestamp {
  font-size: 10px;
  color: var(--text-dim);
  opacity: 0.6;
  display: block;
  margin-top: 4px;
}

.message.user .timestamp {
  text-align: right;
}

.message.assistant .timestamp {
  text-align: left;
}

.message pre {
  background: rgba(0,0,0,0.3);
  padding: 8px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 13px;
  margin: 6px 0;
}

.message code {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
}

.content {
  display: flex;
  flex-direction: column;
}

.assistant-text {
  white-space: normal;
}

.assistant-text ul {
  list-style: disc;
  padding-left: 20px;
  margin: 4px 0;
}

.assistant-text a {
  color: var(--accent);
  text-decoration: underline;
}

.message pre.code-block {
  position: relative;
  padding-top: 26px;
}

.code-block {
  position: relative;
}

.code-lang {
  position: absolute;
  top: 4px;
  left: 8px;
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
}

.code-copy-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
}

.code-copy-btn:hover {
  color: var(--text);
  background: var(--surface);
}

.code-copy-btn.copied {
  color: var(--success);
}

.message-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  opacity: 0;
  transition: opacity 0.2s;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 11px;
  padding: 4px 10px;
}

.message:hover .message-copy-btn,
.message-copy-btn:focus {
  opacity: 1;
}

.message-copy-btn.copied {
  color: var(--success);
}

.tool-card {
  background: var(--surface);
  border-left: 3px solid var(--border);
  padding: 8px 12px;
  margin: 12px 0;
  border-radius: 12px;
}

.tool-card.loading {
  border-left-color: #f59e0b;
  animation: tool-card-pulse 1s infinite;
}

.tool-card.success {
  border-left-color: var(--success);
}

.tool-card.error {
  border-left-color: var(--accent);
}

.tool-card-header {
  display: flex;
  cursor: pointer;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.tool-card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s;
}

.tool-card.expanded .tool-card-body {
  max-height: 400px;
  overflow-y: auto;
}

.tool-card-body pre {
  font-size: 13px;
  margin: 4px 0;
  word-break: break-all;
}

.tool-icon {
  width: 16px;
  height: 16px;
  opacity: 0.7;
  flex-shrink: 0;
}

.tool-status {
  font-size: 12px;
  color: var(--text-dim);
}

.tool-chevron {
  margin-left: auto;
  transition: transform 0.2s;
}

.tool-card.expanded .tool-chevron,
.thinking-block.expanded .tool-chevron {
  transform: rotate(90deg);
}

.thinking-block {
  background: var(--surface);
  border-left: 3px dashed var(--text-dim);
  padding: 8px 12px;
  margin: 12px 0;
  border-radius: 12px;
  opacity: 0.8;
}

.thinking-block-header {
  display: flex;
  cursor: pointer;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.thinking-block-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s;
}

.thinking-block.expanded .thinking-block-body {
  max-height: 400px;
  overflow-y: auto;
}

.typing-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.typing-indicator .dots {
  display: inline-flex;
  gap: 4px;
}

.typing-indicator .dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  display: inline-block;
  animation: typing-bounce 0.6s infinite;
}

.typing-indicator .dots span:nth-child(2) {
  animation-delay: 0.15s;
}

.typing-indicator .dots span:nth-child(3) {
  animation-delay: 0.3s;
}

.scroll-down-btn {
  position: fixed;
  left: 50%;
  bottom: calc(124px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 4px 16px;
  font-size: 12px;
  cursor: pointer;
  z-index: 10;
  display: none;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}

.scroll-down-btn.visible {
  display: block;
}

.error-card {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0;
  animation: fadeIn 0.2s ease;
}

.error-card-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
}

.error-card .retry-btn,
.reconnect-banner .banner-btn {
  margin-top: 8px;
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
}

.reconnect-banner {
  background: var(--accent);
  color: white;
  padding: 8px 16px;
  text-align: center;
  font-size: 13px;
  display: none;
  flex-shrink: 0;
}

.reconnect-banner.visible {
  display: block;
}

.reconnect-toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--success);
  color: #1a1a2e;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 200;
  display: none;
  animation: fadeIn 0.2s ease;
}

.reconnect-toast.visible {
  display: block;
}

@keyframes tool-card-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}

@keyframes typing-bounce {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(-3px); opacity: 1; }
}

/* Controls */
.controls {
  padding: 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.mic-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.mic-btn:active, .mic-btn.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 0 20px var(--accent-glow);
  transform: scale(1.05);
}

.mic-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.mic-btn.active {
  animation: mic-pulse 1.5s infinite;
}

.mic-btn.muted {
  background: #ff4444;
  opacity: 0.6;
}

@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
  50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(233, 69, 96, 0.15); }
}

.control-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.stop-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  display: none;
}

.stop-btn.visible { display: block; }

.mode-btn {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.vad-indicator {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.15s;
}

.vad-indicator.active { background: var(--success); }

.hint {
  font-size: 12px;
  color: var(--text-dim);
}

/* Text input */
.text-input-row {
  display: flex;
  width: 100%;
  gap: 8px;
  align-items: flex-end;
}

.text-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  padding: 10px 16px;
  resize: none;
  outline: none;
  min-height: 40px;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.4;
  transition: border-color 0.2s;
}

.text-input:focus {
  border-color: var(--accent);
}

.text-input:disabled {
  opacity: 0.4;
}

.text-input::placeholder {
  color: var(--text-dim);
}

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.send-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.send-btn:not(:disabled):active {
  transform: scale(0.92);
}

.divider {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* Loading overlay */
.loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
  transition: opacity 0.3s;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Connecting to Voice Bridge...</div>
</div>

<div class="header">
  <h1>Voice Bridge</h1>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Disconnected</span>
  </div>
</div>

<div class="reconnect-banner" id="reconnectBanner"></div>
<div class="chat" id="chat"></div>
<button class="scroll-down-btn" id="scrollDownBtn" type="button" onclick="scrollToBottom()">↓ New messages</button>
<div class="reconnect-toast" id="reconnectToast">Reconnected</div>

<div class="controls">
  <div id="voiceView" style="display:flex;flex-direction:column;align-items:center;width:100%;gap:12px">
    <button class="mic-btn" id="micBtn" disabled>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="control-row">
      <div class="vad-indicator" id="vadIndicator"></div>
      <span class="hint" id="hint">Tap to speak</span>
      <button class="mode-btn" id="modeBtn" title="Toggle always-on / push-to-talk">🎙 Auto</button>
      <button class="stop-btn" id="stopBtn" onclick="stopTTS()">Stop</button>
    </div>
  </div>
  <button class="mode-btn" id="keyboardBtn" title="Switch to text input">⌨</button>
  <div class="divider" id="textDivider" style="display:none"></div>
  <div class="text-input-row" id="textInputRow" style="display:none">
    <textarea
      class="text-input"
      id="textInput"
      placeholder="Type a message..."
      rows="1"
      disabled
    ></textarea>
    <button class="send-btn" id="sendBtn" disabled title="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// iOS Audio Unlock — plays a silent buffer via <audio> + AudioContext to
// bypass the mute switch restriction on Web Audio API.
// ---------------------------------------------------------------------------
function unlockiOSAudio() {
  // Create a tiny silent WAV (1 sample, 8kHz, mono, 8-bit)
  const silentWav = new Uint8Array([
    0x52,0x49,0x46,0x46, 0x25,0x00,0x00,0x00, 0x57,0x41,0x56,0x45,
    0x66,0x6D,0x74,0x20, 0x10,0x00,0x00,0x00, 0x01,0x00,0x01,0x00,
    0x40,0x1F,0x00,0x00, 0x40,0x1F,0x00,0x00, 0x01,0x00,0x08,0x00,
    0x64,0x61,0x74,0x61, 0x01,0x00,0x00,0x00, 0x80
  ]);
  const blob = new Blob([silentWav], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.controls = false;
  audio.preload = 'auto';
  audio.loop = false;
  audio.play().then(() => {
    console.log('[bridge] iOS audio unlocked');
    URL.revokeObjectURL(url);
  }).catch(() => {});
}

// Unlock on first user interaction
let audioUnlocked = false;
document.addEventListener('touchstart', function onTouch() {
  if (!audioUnlocked) {
    audioUnlocked = true;
    unlockiOSAudio();
  }
}, { once: true });
document.addEventListener('click', function onClick() {
  if (!audioUnlocked) {
    audioUnlocked = true;
    unlockiOSAudio();
  }
}, { once: true });

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let ws = null;
let audioCtxCapture = null;
let audioCtxPlayback = null;
let workletNode = null;
let micStream = null;
let isRecording = false;
let isTTSPlaying = false;

// Always-on mode: mic resumes automatically after TTS playback.
// Push-to-talk mode: user taps mic manually.
// Persisted in localStorage so it survives page reloads (new token URLs).
let alwaysOnMode = localStorage.getItem('voiceBridgeMode') === 'auto';

// Audio playback queue (24kHz Int16LE chunks)
let playbackQueue = [];
let isPlayingAudio = false;
let activeSource = null;  // track playing BufferSource so Stop can kill it
let userScrolledUp = false;
let newContentArrived = false;
let lastUserMessage = '';
let reconnectAttempts = 0;
let reconnectTimer = null;
let reconnectToastTimer = null;
const PLAYBACK_RATE = 24000;
const JITTER_BUFFER_MS = 0;

// DOM
const chat = document.getElementById('chat');
const micBtn = document.getElementById('micBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const vadIndicator = document.getElementById('vadIndicator');
const stopBtn = document.getElementById('stopBtn');
const modeBtn = document.getElementById('modeBtn');
const hint = document.getElementById('hint');
const loading = document.getElementById('loading');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const reconnectBanner = document.getElementById('reconnectBanner');
const reconnectToast = document.getElementById('reconnectToast');
const scrollDownBtn = document.getElementById('scrollDownBtn');

chat.addEventListener('scroll', () => {
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 50;
  userScrolledUp = !atBottom;
  if (atBottom) {
    newContentArrived = false;
  }
  updateScrollDownButton();
});

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?token=${token}`;

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    if (reconnectAttempts > 0) {
      showReconnectToast();
    }
    reconnectAttempts = 0;
    hideReconnectBanner();
    setStatus('connected', 'Connected');
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      console.log('[bridge] Audio data received:', evt.data.byteLength, 'bytes');
      handleAudioData(evt.data);
    } else if (evt.data instanceof Blob) {
      // Some WebSocket implementations deliver binary as Blob, not ArrayBuffer
      console.log('[bridge] Blob received:', evt.data.size, 'bytes — converting');
      evt.data.arrayBuffer().then(buf => handleAudioData(buf));
    } else {
      try {
        const msg = JSON.parse(evt.data);
        handleMessage(msg);
      } catch(e) {}
    }
  };

  ws.onclose = (evt) => {
    setStatus('', 'Disconnected');
    micBtn.disabled = true;
    textInput.disabled = true;
    sendBtn.disabled = true;
    stopRecording();
    loading.classList.add('hidden');
    removeTypingIndicator();
    reconnectAttempts += 1;
    hint.textContent = 'Connection lost';
    if (reconnectAttempts >= 5) {
      showReconnectBanner(`
        Unable to connect. Retry manually.
        <div><button class="banner-btn" type="button" onclick="manualReconnect()">Retry</button></div>
      `);
      return;
    }

    showReconnectBanner(`Connection lost. Reconnecting... (attempt ${reconnectAttempts}/5)`);
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => {};
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'ready':
      loading.classList.add('hidden');
      micBtn.disabled = false;
      textInput.disabled = false;
      sendBtn.disabled = false;
      // In always-on mode, start mic automatically on connect.
      if (alwaysOnMode) {
        startRecording();
      }
      break;

    case 'vad_state':
      vadIndicator.classList.toggle('active', msg.speaking);
      break;

    case 'transcript':
      lastUserMessage = msg.text;
      userScrolledUp = false;
      addMessage('user', msg.text);
      scrollToBottom();
      setStatus('processing', 'Processing...');
      hint.textContent = 'Claude is thinking...';
      showTypingIndicator();
      // In push mode, stop recording and flush server-side buffers.
      // In auto mode, keep mic active for barge-in (server gates VAD during TTS).
      if (!alwaysOnMode && isRecording) {
        stopRecording();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'vad_reset' }));
        }
      }
      break;

    case 'assistant_chunk':
      removeTypingIndicator();
      appendAssistantChunk(msg.text);
      break;

    case 'tool_use_start':
      removeTypingIndicator();
      appendToolCard(msg);
      break;

    case 'tool_result':
      updateToolCard(msg);
      break;

    case 'thinking':
      removeTypingIndicator();
      appendThinkingBlock(msg);
      break;

    case 'assistant_done':
      finalizeAssistantMessage();
      // Re-enable text input now that the response is complete
      sendBtn.disabled = false;
      textInput.disabled = false;
      // Reset status if TTS isn't playing (if TTS is playing,
      // onPlaybackComplete will reset it when audio finishes)
      if (!isTTSPlaying && !isPlayingAudio) {
        setStatus('connected', 'Connected');
        hint.textContent = alwaysOnMode ? 'Speak now' : 'Tap mic to speak';
      }
      break;

    case 'tts_stop':
      // Server cancelled previous TTS — clear all playback immediately
      playbackQueue = [];
      isPlayingAudio = false;
      isTTSPlaying = false;
      stopBtn.classList.remove('visible');
      break;

    case 'tts_start':
      isTTSPlaying = true;
      stopBtn.classList.add('visible');
      playbackQueue = [];
      isPlayingAudio = false;
      // Keep mic active during TTS — server handles barge-in detection.
      // The server gates normal VAD with _tts_active so mic audio during TTS
      // is only used for "stop" keyword detection, not re-submitted as speech.
      break;

    case 'tts_end':
      isTTSPlaying = false;
      // Play any remaining buffered audio — onPlaybackComplete fires when done.
      if (playbackQueue.length > 0 && !isPlayingAudio) {
        playBufferedAudio();
      } else if (!isPlayingAudio) {
        // Edge case: tts_end arrived with nothing buffered at all.
        onPlaybackComplete();
      }
      // If isPlayingAudio is true, playBufferedAudio's onended chain will call
      // onPlaybackComplete when the last chunk finishes.
      break;

    case 'error':
      removeTypingIndicator();
      addErrorMessage(msg.message);
      sendBtn.disabled = false;
      textInput.disabled = false;
      setStatus('connected', 'Connected');
      hint.textContent = alwaysOnMode ? 'Speak now' : 'Tap to speak';
      break;
  }
}

// ---------------------------------------------------------------------------
// Audio capture (16kHz mono PCM via AudioWorklet)
// ---------------------------------------------------------------------------

async function startRecording() {
  if (isRecording) return;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        sampleRate: 16000,
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });

    audioCtxCapture = new AudioContext({ sampleRate: 16000 });

    // Register AudioWorklet processor inline via Blob
    const workletCode = `
      class PCMProcessor extends AudioWorkletProcessor {
        process(inputs) {
          const input = inputs[0];
          if (input && input[0] && input[0].length > 0) {
            // Convert Float32 to Int16
            const float32 = input[0];
            const int16 = new Int16Array(float32.length);
            for (let i = 0; i < float32.length; i++) {
              const s = Math.max(-1, Math.min(1, float32[i]));
              int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            this.port.postMessage(int16.buffer, [int16.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm-processor', PCMProcessor);
    `;
    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await audioCtxCapture.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    const source = audioCtxCapture.createMediaStreamSource(micStream);
    workletNode = new AudioWorkletNode(audioCtxCapture, 'pcm-processor');

    workletNode.port.onmessage = (evt) => {
      if (isRecording && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(evt.data);
      }
    };

    source.connect(workletNode);
    workletNode.connect(audioCtxCapture.destination); // needed to keep processing

    isRecording = true;
    micBtn.classList.add('active');
    setStatus('recording', 'Listening...');
    hint.textContent = alwaysOnMode
      ? 'Speak now — say Stop to interrupt'
      : 'Speak now — silence ends recording';

  } catch (err) {
    console.error('Mic error:', err);
    addErrorMessage('Microphone access denied. Please allow mic access.', false);
  }
}

function stopRecording() {
  if (!isRecording) return;

  isRecording = false;
  micBtn.classList.remove('active');

  if (workletNode) {
    workletNode.disconnect();
    workletNode = null;
  }
  if (audioCtxCapture) {
    audioCtxCapture.close();
    audioCtxCapture = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
}

// Toggle recording on mic button click

  }
  // Also unlock iOS audio on this user gesture
  if (!audioUnlocked) {
    audioUnlocked = true;
    unlockiOSAudio();
  }

  if (alwaysOnMode) {
    // In auto mode, mic button acts as mute/unmute
    if (isRecording) {

      micBtn.classList.add('muted');

    // Push-to-talk: toggle recording
    if (isRecording) {
      stopRecording();
      // Flush server-side audio buffers to prevent stale audio
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'vad_reset' }));
      }
      setStatus('connected', 'Connected');
      hint.textContent = 'Tap mic to speak';
    } else {
      startRecording();
    }
  }
});

// ---------------------------------------------------------------------------
// Audio playback (24kHz Int16LE from server)
// ---------------------------------------------------------------------------

function handleAudioData(buffer) {
  playbackQueue.push(buffer);

  // Start playing after jitter buffer fills or TTS ended
  if (!isPlayingAudio) {
    const totalBytes = playbackQueue.reduce((s, b) => s + b.byteLength, 0);
    const totalMs = (totalBytes / 2) / PLAYBACK_RATE * 1000;

    if (totalMs >= JITTER_BUFFER_MS || !isTTSPlaying) {
      playBufferedAudio();
    }
  }
}

function playBufferedAudio() {
  if (playbackQueue.length === 0) {
    isPlayingAudio = false;
    return;
  }

  isPlayingAudio = true;

  if (!audioCtxPlayback || audioCtxPlayback.state === 'closed') {
    audioCtxPlayback = new AudioContext({ sampleRate: PLAYBACK_RATE });
  }
  // iOS Safari suspends AudioContext created without user gesture — resume it
  if (audioCtxPlayback.state === 'suspended') {
    audioCtxPlayback.resume();
  }

  // Merge all queued buffers
  const totalLen = playbackQueue.reduce((s, b) => s + b.byteLength, 0) / 2;
  const merged = new Float32Array(totalLen);
  let offset = 0;
  for (const buf of playbackQueue) {
    const int16 = new Int16Array(buf);
    for (let i = 0; i < int16.length; i++) {
      merged[offset++] = int16[i] / 32768;
    }
  }
  playbackQueue = [];

  const audioBuffer = audioCtxPlayback.createBuffer(1, merged.length, PLAYBACK_RATE);
  audioBuffer.getChannelData(0).set(merged);

  const source = audioCtxPlayback.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtxPlayback.destination);
  source.onended = () => {
    activeSource = null;
    // Play next batch if available
    if (playbackQueue.length > 0) {
      playBufferedAudio();
    } else {
      isPlayingAudio = false;
      // If TTS has fully ended (server sent tts_end) and the queue is now
      // empty, all audio has been played — notify server and resume mic.
      if (!isTTSPlaying) {
        onPlaybackComplete();
      }
    }
  };
  activeSource = source;
  source.start();
}

function stopTTS() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop_tts' }));
  }
  // Stop the currently playing audio source
  if (activeSource) {
    try { activeSource.stop(); } catch(e) {}
    activeSource = null;
  }
  playbackQueue = [];
  isPlayingAudio = false;
  isTTSPlaying = false;
  stopBtn.classList.remove('visible');
  onPlaybackComplete();
}

/**
 * Called when all TTS audio has finished playing back on the client.
 * Notifies the server that playback is complete, updates UI, and resumes
 * the mic in always-on mode so the user can speak again.
 */
function onPlaybackComplete() {
  // Notify server — it uses this to know the client is ready for next input.
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'playback_done' }));
  }

  stopBtn.classList.remove('visible');
  setStatus('connected', 'Connected');

  if (alwaysOnMode) {
    hint.textContent = 'Speak now — say Stop to interrupt';
    startRecording();
  } else {
    hint.textContent = 'Tap mic to speak';
  }
}

function formatTimestamp(date = new Date()) {

function getLastChatMessage() {

    .filter((el) => el.id !== 'typingIndicator')

function applyMessageGrouping(el, role, timeMs) {
  const previous = getLastChatMessage();
  if (!previous) return;
  if (previous.dataset.role !== role) return;
  const previousTime = Number(previous.dataset.time || 0);
  if (timeMs - previousTime <= 30000) {
    el.classList.add('grouped');
  }
}

function renderMarkdown(textSpan) {
  if (!textSpan) return;
  textSpan.innerHTML = simpleMarkdown(textSpan._rawText || '');

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function plainTextToHtml(text) {
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function formatInlineMarkdown(text) {
  const codeTokens = [];
  let html = text.replace(/`([^`]+)`/g, (_, code) => {
    const token = `__INLINE_CODE_${codeTokens.length}__`;
    codeTokens.push(`<code>${code}</code>`);
    return token;
  });

  html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  codeTokens.forEach((tokenHtml, idx) => {
    html = html.replace(`__INLINE_CODE_${idx}__`, tokenHtml);
  });

  return html;
}

function renderMarkdownLines(text) {
  const lines = text.split('\n');
  const parts = [];
  let inList = false;

  const closeList = () => {
    if (inList) {
      parts.push('</ul>');
      inList = false;
    }
  };

  lines.forEach((line) => {
    if (!line) {
      closeList();
      parts.push('<br>');
      return;
    }

    if (/^__CODE_BLOCK_\d+__$/.test(line)) {
      closeList();
      parts.push(line);
      return;
    }

    const headingMatch = line.match(/^###\s+(.+)$/);
    if (headingMatch) {
      closeList();
      parts.push(`<strong>${formatInlineMarkdown(headingMatch[1])}</strong><br>`);
      return;
    }

    const listMatch = line.match(/^\s*-\s+(.+)$/);
    if (listMatch) {
      if (!inList) {
        parts.push('<ul>');
        inList = true;
      }
      parts.push(`<li>${formatInlineMarkdown(listMatch[1])}</li>`);
      return;
    }

    closeList();
    parts.push(`${formatInlineMarkdown(line)}<br>`);
  });

  closeList();
  return parts.join('');
}

function simpleMarkdown(text) {
  let completeText = text;
  let trailingPlainText = '';
  const fenceMatches = text.match(/```/g);

  if (fenceMatches && fenceMatches.length % 2 === 1) {
    const lastFenceIndex = text.lastIndexOf('```');
    completeText = text.slice(0, lastFenceIndex);
    trailingPlainText = text.slice(lastFenceIndex);
  }

  let html = escapeHtml(completeText);
  const codeBlocks = [];

  html = html.replace(/```([A-Za-z0-9_+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const language = lang || '';
    const token = `__CODE_BLOCK_${codeBlocks.length}__`;
    const languageLabel = language ? `<span class="code-lang">${language}</span>` : '';
    codeBlocks.push(
      `<pre class="code-block" data-lang="${language}">${languageLabel}<button class="code-copy-btn" onclick="copyCodeBlock(this)">Copy</button><code>${code}</code></pre>`
    );
    return token;
  });

  html = renderMarkdownLines(html);
  codeBlocks.forEach((blockHtml, idx) => {
    html = html.replace(`__CODE_BLOCK_${idx}__`, blockHtml);
  });

  if (trailingPlainText) {
    html += plainTextToHtml(trailingPlainText);
  }

  return html;
}

function truncateText(value, limit) {
  if (value.length <= limit) return value;
  return value.slice(0, limit) + '\n...';

  textarea.value = text;
  textarea.style.position = 'fixed';

async function copyCodeBlock(btn) {
  const code = btn.parentElement.querySelector('code');
  if (!code) return;
  try {
    await copyText(code.textContent);
    showCopiedState(btn);
  } catch (err) {
    console.error('Copy failed:', err);
  }
}

function appendMessageCopyButton(messageEl) {
  if (!messageEl || messageEl.querySelector('.message-copy-btn') || !(messageEl._rawText || '')) {
    return;
  }

  const btn = document.createElement('button');
  btn.className = 'message-copy-btn';
  btn.textContent = 'Copy';
  btn.type = 'button';
  btn.setAttribute('onclick', 'copyMessage(this)');
  messageEl.appendChild(btn);
}

async function copyMessage(btn) {
  const messageEl = btn.closest('.message.assistant');
  if (!messageEl || !messageEl._rawText) return;
  try {
    await copyText(messageEl._rawText);
    showCopiedState(btn);
  } catch (err) {
    console.error('Copy failed:', err);
  }
}

// ---------------------------------------------------------------------------
// Status
// ---------------------------------------------------------------------------

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

// ---------------------------------------------------------------------------
// Text input
// ---------------------------------------------------------------------------

function sendTextMessage() {
  const text = textInput.value.trim();
  sendMessageText(text);
}

function sendMessageText(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (sendBtn.disabled) return;
  lastUserMessage = text;
  userScrolledUp = false;

  // Show in chat immediately
  addMessage('user', text);
  scrollToBottom();

  // Send to server
  ws.send(JSON.stringify({ type: 'text_message', text }));

  // Clear input and disable until response completes
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
  textInput.disabled = true;

  setStatus('processing', 'Processing...');
  hint.textContent = 'Claude is thinking...';
  showTypingIndicator();
}

function retryLastMessage() {
  if (!lastUserMessage) return;
  sendMessageText(lastUserMessage);
}

sendBtn.addEventListener('click', sendTextMessage);

textInput.addEventListener('keydown', (evt) => {
  // Send on Enter (not Shift+Enter)
  if (evt.key === 'Enter' && !evt.shiftKey) {
    evt.preventDefault();
    sendTextMessage();
  }
});

// Auto-resize textarea as user types
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

connect();
</script>
</body>
</html>
